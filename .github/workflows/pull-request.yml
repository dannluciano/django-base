name: CI-Review

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DOKKU_HOST: ${{ secrets.DOKKU_HOST }}
  DOKKU_USER: dokku
  DOKKU_SSH_PORT: ${{ secrets.DOKKU_SSH_PORT || 22 }}
  BASE_DOMAIN: casa.dannluciano.com.br
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/basedb
  DJANGO_SETTINGS_MODULE: "{{project_name}}.settings.py"
  SECRET_KEY: "E7V12gvEy7vkzJ3gGxE8x0lzAcHoc4WOdvgfkNd4ThA="
  DEBUG: True

jobs:
  ci:
    name: Continuos Integration
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_DB: basedb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d basedb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.5"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.dev.txt ; elif [ -f pyproject.toml ]; then pip install .; else echo 'requirements.txt ou pyproject.toml não encontrado'; exit 1; fi
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "--version"
      - run: ruff check --ignore N999
      - run: ruff format --check
      - name: Django system check
        env:
          DJANGO_SETTINGS_MODULE: ${{ vars.DJANGO_SETTINGS_MODULE || '{{project_name}}.settings' }}
          SECRET_KEY: ci-only-secret-key
        run: python manage.py check
      - name: Django tests
        env:
          DJANGO_SETTINGS_MODULE: ${{ vars.DJANGO_SETTINGS_MODULE || '{{project_name}}.settings' }}
          SECRET_KEY: ci-only-secret-key
        run: python manage.py test
      - name: Validate Docker image
        run: docker build --pull -t base-ci .

  review:
    name: Deploy Review App
    needs: ci
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Configure SSH
        uses: ./.github/actions/setup-dokku-ssh
        with:
          ssh-key: ${{ secrets.DOKKU_SSH_KEY }}
          known-hosts: ${{ secrets.DOKKU_KNOWN_HOSTS }}
      - name: Compute names
        id: review
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          echo "app=base-pr-${PR}" >> "$GITHUB_OUTPUT"
          echo "db=base-pr-${PR}-db" >> "$GITHUB_OUTPUT"
          echo "domain=pr-${PR}.${BASE_DOMAIN}" >> "$GITHUB_OUTPUT"
          echo "bucket_name"=base-pr-${PR} >> "$GITHUB_OUTPUT"
      - name: Create Dokku app and database
        env:
          APP: ${{ steps.review.outputs.app }}
          DB: ${{ steps.review.outputs.db }}
        run: |
          if ! dokku-ssh "apps:exists '$APP'"; then
            dokku-ssh "apps:create '$APP'"
          fi
          if ! dokku-ssh "postgres:exists '$DB'"; then
            dokku-ssh "postgres:create '$DB'"
          fi
          if ! dokku-ssh "postgres:linked '$DB' '$APP'"; then
            dokku-ssh "postgres:link '$DB' '$APP'"
          fi
      - name: Configure Dokku App
        env:
          APP: ${{ steps.review.outputs.app }}
          DOMAIN: ${{ steps.review.outputs.domain }}
          DJANGO_SETTINGS_MODULE: ${{ vars.DJANGO_SETTINGS_MODULE || '{{project_name}}.settings' }}
          AWS_S3_ACCESS_KEY_ID: ${{ secrets.AWS_S3_ACCESS_KEY_ID }}
          AWS_S3_SECRET_ACCESS_KEY: ${{ secrets.AWS_S3_SECRET_ACCESS_KEY }}
          AWS_S3_ENDPOINT_URL: ${{secrets.AWS_S3_ENDPOINT_URL }}
          AWS_STORAGE_BUCKET_NAME: ${{ steps.review.outputs.bucket_name }}
        run: |
          dokku-ssh "domains:set '$APP' '$DOMAIN'"
          dokku-ssh "config:set '$APP' DJANGO_SETTINGS_MODULE='$DJANGO_SETTINGS_MODULE' SECRET_KEY='$SECRET_KEY' DEBUG='$DEBUG' ALLOWED_HOSTS='$DOMAIN' CSRF_TRUSTED_ORIGINS='https://*.$BASE_DOMAIN' AWS_S3_ACCESS_KEY_ID='$AWS_S3_ACCESS_KEY_ID' AWS_S3_SECRET_ACCESS_KEY='$AWS_S3_SECRET_ACCESS_KEY' AWS_S3_ENDPOINT_URL='$AWS_S3_ENDPOINT_URL' AWS_STORAGE_BUCKET_NAME='$AWS_STORAGE_BUCKET_NAME' "
          dokku-ssh "config:set --no-restart '$APP' PR_NUMBER='${{ github.event.pull_request.number }}' PR_SHA='${{ github.event.pull_request.head.sha }}'"
      - name: Deploy PR to Dokku
        env:
          APP: ${{ steps.review.outputs.app }}
        run: |
          git remote remove dokku 2>/dev/null || true
          git remote add dokku "ssh://$DOKKU_USER@$DOKKU_HOST:$DOKKU_SSH_PORT/$APP"
          git push dokku "HEAD:refs/heads/main" --force
      - name: Run Migrations
        env:
          APP: ${{ steps.review.outputs.app }}
        run: |
          dokku-ssh "run '$APP' python manage.py migrate --noinput"
      - name: Load Data From Seeds
        env:
          APP: ${{ steps.review.outputs.app }}
        run: |
          dokku-ssh "run '$APP' python manage.py loaddata seeds.json"
      - name: Create Assets Bucket
        env:
          APP: ${{ steps.review.outputs.app }}
        run: |
          dokku-ssh "run '$APP' python manage.py create_bucket"
      - name: Enable HTTPS
        env:
          APP: ${{ steps.review.outputs.app }}
        run: |
          dokku-ssh "letsencrypt:enable '$APP'" || true
      - name: Review URL
        env:
          DOMAIN: ${{ steps.review.outputs.domain }}
        run: |
          { echo '## 🚀 Django Review App'; echo; echo "**URL:** https://$DOMAIN"; echo; echo "Atualizado pelo PR #${{ github.event.pull_request.number }}."; } >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    name: Destroy Review App
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Configure SSH
        uses: ./.github/actions/setup-dokku-ssh
        with:
          ssh-key: ${{ secrets.DOKKU_SSH_KEY }}
          known-hosts: ${{ secrets.DOKKU_KNOWN_HOSTS }}
      - name: Compute names
        id: review
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          echo "app=base-pr-${PR}" >> "$GITHUB_OUTPUT"
          echo "db=base-pr-${PR}-db" >> "$GITHUB_OUTPUT"
      - name: Destroy Dokku app and database
        env:
          APP: ${{ steps.review.outputs.app }}
          DB: ${{ steps.review.outputs.db }}
        run: |
          if dokku-ssh "apps:exists '$APP'"; then
            dokku-ssh "apps:destroy '$APP' --force"
          fi
          if dokku-ssh "postgres:exists '$DB'"; then
            dokku-ssh "postgres:destroy '$DB' --force"
          fi
      - name: Cleanup summary
        env:
          APP: ${{ steps.review.outputs.app }}
          DB: ${{ steps.review.outputs.db }}
        run: |
          { echo '## 🧹 Django Review App Cleanup'; echo; echo "Removed Dokku app \`$APP\` and database \`$DB\`."; } >> "$GITHUB_STEP_SUMMARY"
